# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# Choosing a build backend for your Python package
[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta" 

[project]
authors = [
  {name = "Jim Fluke", email = "james.fluke@colostate.edu" }
]
name = "youvegotdata" # REQUIRED
version = "2.0.0"
description = "Send new file notifications"
readme = "README.md"

requires-python = ">=3.8"

dependencies = ["pika", "platformdirs"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ygd = "youvegotdata.cli:main"

[tool.black]
# Agnostic of the build backend: ensure formatting stays 3.8-compatible.
target-version = ["py38"]
line-length = 88
