name: Run Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      # Editable source install: this workflow validates source changes (unlike
      # package-and-publish.yaml, which tests the built wheel)
      - name: Install package (editable) and test dependencies
        run: |
          uv pip install -e .
          uv pip install pytest pytest-cov pytest-xdist pydantic

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=youvegotdata

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: warn
